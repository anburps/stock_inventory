{% extends "inventory/base.html" %}
{% block content %}
<div class="container mt-5">
  <h2>Make Payment for Bill #{{ bill.id }}</h2>

  <p><strong>Customer:</strong> {{ bill.customer }}</p>
  <p><strong>Total Amount:</strong> ₹{{ bill.purchase_total }}</p>
  <p><strong>Paid:</strong> ₹{{ bill.paid_total }}</p>
  <p><strong>Balance Due:</strong> ₹{{ bill.balance_due }}</p>

  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Add Payment</button>
  </form>
</div>
{% endblock %}

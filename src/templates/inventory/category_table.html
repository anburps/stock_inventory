<table class="table table-bordered table-striped">
    <thead>
      <tr>
          <th>S.No</th>
          <th>Name</th>
          <th>Description</th>
          <th>Created At</th>
          <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for cat in categories %}
      <tr>
          <td>{{ forloop.counter0|add:categories.start_index }}</td>
          <td>{{ cat.category_name }}</td>
          <td>{{ cat.description }}</td>
          <td>{{ cat.created_at|date:"Y-m-d H:i" }}</td>
          <td>
              <a href="{% url 'category_update' cat.pk %}" class="btn btn-sm btn-warning">Edit</a>
              <a href="{% url 'category_delete' cat.pk %}" class="btn btn-sm btn-danger">Delete</a>
          </td>
      </tr>
      {% empty %}
      <tr><td colspan="5">No categories found</td></tr>
      {% endfor %}
    </tbody>
  </table>

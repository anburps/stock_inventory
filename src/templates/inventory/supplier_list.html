{% extends "inventory/base.html" %}
{% block content %}
<h2>Suppliers</h2>
<a href="{% url 'supplier_create' %}" class="btn btn-primary mb-2">Add Supplier</a>
<table class="table table-striped">
  <thead>
    <tr><th>S.No</th><th>Name</th><th>Contact</th><th>Email</th><th>Actions</th></tr>
  </thead>
  <tbody>
    {% for supplier in suppliers %}
    <tr>
      <td>{{ forloop.counter}}</td>
      <td>{{ supplier.name }}</td>
      <td>{{ supplier.contact }}</td>
      <td>{{ supplier.email }}</td>
      <td>
        <a href="{% url 'supplier_update' supplier.pk %}" class="btn btn-sm btn-warning">Edit</a>
        <a href="{% url 'supplier_delete' supplier.pk %}" class="btn btn-sm btn-danger">Delete</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No suppliers found</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
